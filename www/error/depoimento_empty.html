<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Depoimento</title>
  <style>
    .error { color: red; }
  </style>
</head>
<body>

<h1>Depoimento</h1>

<form action="/depoimento.html" method="POST">
  <p>
    <label for="nome" class="error">Nome (máx 30 caracteres):</label><br>
    <input type="text" id="nome" name="nome" maxlength="30" required>
  </p>
  <p>
    <label for="depoimento" class="error">Depoimento (máx 200 caracteres):</label><br>
    <textarea id="depoimento" name="depoimento" maxlength="200" rows="4" cols="40" required></textarea>
  </p>
  <p class="error">Todos campos devem estar preenchidos</p>
  <p>
    <input type="submit" value="Enviar">
  </p>
</form>

</body>
</html>
