server {
   listen 8080;
   server_name localhost;
   root www/;
   index index.html;
   
   client_max_body_size 1M;
   
   location / {
       allow GET POST DELETE;
   }
   
   location /cgi-bin/ {
       allow GET POST;
       cgi_extensions .py .php;
   }
   
   location /api/curriculum {
       allow GET POST DELETE;
       upload_dir www/uploads/;
   }
   
   location /old-path {
       return 301 /new-path;
   }
   
   location /another-old {
       return 302 /another-new;
   }
    
   error_page 400 www/error/400.html;
   error_page 403 www/error/403.html;
   error_page 404 www/error/404.html;
   error_page 405 www/error/405.html;
   error_page 413 www/error/413.html;
   error_page 500 www/error/500.html;
   error_page 504 www/error/504.html;
}

#Claudio: adicionei um segundo servidor na porta 8081 para testar múltiplas portas, ta na regual vao testar
server {
    listen 8081;
    server_name localhost;
    root www/;
    index index.html;

    location / {
        allow GET POST DELETE;
    }

    location /cgi-bin/ {
        allow GET POST;
